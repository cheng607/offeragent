<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E4573D">
  <meta name="description" content="OfferAgent · 基于艾宾浩斯遗忘曲线的面试刷题记忆工具">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OfferAgent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <title>OfferAgent · 面试刷题记忆</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">

    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="header-brand">
        <span class="logo-dot" aria-hidden="true"></span>
        <span class="header-title">OfferAgent</span>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="打开设置">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <!-- 主内容区 -->
    <main class="app-main" id="app-main">
      <section class="view is-active" id="view-home" data-view="home"></section>
      <section class="view" id="view-practice" data-view="practice"></section>
      <section class="view" id="view-bank" data-view="bank"></section>
      <section class="view" id="view-stats" data-view="stats"></section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-active" data-tab="home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 2l9 7.5"></path><path d="M5 9.5V21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path><path d="M9 22v-6h6v6"></path></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="practice">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5z"></path><path d="m3 12 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></svg>
        <span>刷题</span>
      </button>
      <button class="tab" data-tab="bank">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>题库</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15v3"></path><path d="M12 10v8"></path><path d="M17 6v12"></path></svg>
        <span>统计</span>
      </button>
    </nav>

    <!-- 设置弹窗 -->
    <div class="modal-backdrop" id="settings-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-head">
          <h2 id="settings-title">设置</h2>
          <button class="icon-btn" id="btn-close-settings" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-block">
            <label class="field-label" for="set-new">每日新题目标</label>
            <input class="field-input" type="number" id="set-new" min="1" max="50" inputmode="numeric">
          </div>
          <div class="form-block">
            <label class="field-label" for="set-review">每日复习目标</label>
            <input class="field-input" type="number" id="set-review" min="1" max="200" inputmode="numeric">
          </div>
          <div class="form-block">
            <button class="btn btn-ghost" id="btn-export">导出学习数据</button>
            <p class="field-hint">备份为 JSON 文件，可随时导入恢复。</p>
          </div>
          <div class="form-block">
            <button class="btn btn-ghost" id="btn-import">导入学习数据</button>
            <input type="file" id="file-import" accept="application/json,.json" hidden>
          </div>
          <div class="form-block danger">
            <button class="btn btn-danger" id="btn-clear">清空学习数据</button>
          </div>
          <div class="about">
            <p>OfferAgent v1.0 · 基于艾宾浩斯遗忘曲线</p>
            <p>本地数据存储于浏览器，注意及时备份。</p>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-primary" id="btn-save-settings">保存</button>
        </div>
      </div>
    </div>

    <!-- 轻提示 -->
    <div class="toast" id="toast" hidden></div>
  </div>

  <!-- 脚本按依赖顺序加载 -->
  <script src="js/config.js"></script>
  <script src="js/bank-extra.js"></script>
  <script src="js/bank-fe2.js"></script>
  <script src="js/bank-fe3.js"></script>
  <script src="js/bank-ai1.js"></script>
  <script src="js/bank-ai2.js"></script>
  <script src="js/bank-ai3.js"></script>
  <script src="js/bank-ai4.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          console.log('[OfferAgent] SW registered:', reg.scope);
        }).catch(function (err) {
          console.warn('[OfferAgent] SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
